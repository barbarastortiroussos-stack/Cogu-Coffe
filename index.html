<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cogu Coffee - Mushroom Village</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. PLACAR DO JOGO -->
  <div id="placar">
    <h1>🍄 Cogu Coffee</h1>
    <div>
      <span>Coins: 🪙 <strong id="qtd-moedas">0</strong></span><br>
      <span id="progresso-marco" class="texto-progresso"></span>
    </div>
    <div class="botoes-placar">
      <button id="btn-abrir-loja">🏪 Shop</button>
      <button id="btn-pause">Pause</button>
    </div>
  </div>

  <!-- BARRA DE DIA (timer da partida) -->
  <div id="barra-dia-container">
    <span id="texto-dia">Day 1</span>
    <div class="trilho-barra-dia">
      <div id="barra-dia"></div>
    </div>
  </div>

  <!-- 2. CENÁRIO E ÁREA DO CLIENTE -->
  <div id="cenario">
    
    <div id="area-cliente">
      <div id="balao-pedido">
        <span id="texto-pedido">Loading order...</span>
      </div>
      <div id="barra-paciencia-container">
        <div id="barra-paciencia"></div>
      </div>
      <img id="sprite-cliente" src="customer-1.png" alt="Customer">
    </div>
    <!-- BALCÃO EM CARROSSEL: um pedido por vez, com setas de navegação -->
    <div id="balcao">
      <button id="seta-esquerda-balcao" class="seta-balcao" aria-label="Previous order">‹</button>
      <div id="pedido-atual-balcao"></div>
      <button id="seta-direita-balcao" class="seta-balcao" aria-label="Next order">›</button>
    </div>
  </div>

  <!-- 3. LOJA COMO MODAL (fica escondida até o jogador clicar em "Shop") -->
  <div id="loja-overlay" class="loja-overlay">
    <div class="painel-loja" id="lojinha">
      <button id="btn-fechar-loja" class="btn-fechar-loja" aria-label="Close shop">✕</button>
      <h2>🏪 Mushroom Village Shop</h2>
      <p style="margin-bottom: 10px;">Buy recipes and attract new customers to the café!</p>

      <!-- É AQUI QUE O JAVASCRIPT DESENHA OS CARDS -->
      <div id="container-itens-loja" class="grid-loja"></div>
    </div>
  </div>

  <!-- 4. TELA DE FIM DE DIA (modal com resumo da partida) -->
  <div id="fimdia-overlay" class="loja-overlay">
    <div class="painel-fimdia" id="painel-fimdia">
      <h2 id="fimdia-titulo">Day 1 Complete!</h2>

      <div class="fimdia-linha">
        <span>Profits</span>
        <strong id="fimdia-lucros">🪙 0</strong>
      </div>
      <div class="fimdia-linha">
        <span>Expenses</span>
        <strong id="fimdia-gastos">🪙 0</strong>
      </div>
      <div class="fimdia-linha fimdia-saldo">
        <span>Net</span>
        <strong id="fimdia-saldo">🪙 0</strong>
      </div>

      <p id="fimdia-receita" class="fimdia-receita"></p>
      <p id="fimdia-frase" class="fimdia-frase"></p>

      <button id="btn-proximo-dia" class="btn-proximo-dia">Start Next Day ▶</button>
    </div>
  </div>

  <!-- Elemento de Áudio para Música de Fundo -->
  <audio id="musica-fundo" src="vibehorn-lo-fi-music-romantic-jazzy-love-479215.mp3" loop></audio>
  <!-- Script do Jogo -->
  <script src="script.js"></script>

  <script>
  window["GD_OPTIONS"] = {
    "gameId": "5a40f6aa8d2c4e959e456f851258987f",
    "onEvent": function(event) {
      switch (event.name) {
        case "SDK_GAME_START":
          // O anúncio acabou ou não carregou: retoma a música/som do jogo
          if (window.audioManager) window.audioManager.resume();
          break;
        case "SDK_GAME_PAUSE":
          // O anúncio começou: pausa a música do jogo
          if (window.audioManager) window.audioManager.pause();
          break;
      }
    },
  };
  (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = 'https://html5.api.gamedistribution.com/main.min.js';
      fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'gamedistribution-jssdk'));
</script>
</body>
</html>
