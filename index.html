<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cogu Coffee - Vila Cogumelo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. PLACAR DO JOGO -->
  <div id="placar">
    <h1>🍄 Cogu Coffee</h1>
    <div>
      <span>Moedas: 🪙 <strong id="qtd-moedas">0</strong></span>
    </div>
    <button id="btn-pause">Pausar</button>
  </div>

  <!-- 2. CENÁRIO E ÁREA DO CLIENTE -->
  <div id="cenario">
    
    <div id="area-cliente">
      <div id="balao-pedido">
        <span id="texto-pedido">Carregando pedido...</span>
      </div>
      <img id="sprite-cliente" src="customer-1.png" alt="Cliente">
    </div>

    <!-- BALCÃO COM BOTÕES DE ENTREGA DE PEDIDOS -->
    <div id="balcao">
      <button class="btn-item" onclick="entregarPedido('Café')">☕ Café</button>
      <button class="btn-item" onclick="entregarPedido('Chá')">🍵 Chá</button>
      <button class="btn-item" onclick="entregarPedido('Bolo')">🍰 Bolo</button>
      <button class="btn-item" onclick="entregarPedido('Torta')">🥧 Torta</button>
    </div>

  </div>

  <!-- 3. PAINEL DA LOJINHA DE MELHORIAS -->
  <div class="painel-loja" id="lojinha">
    <h2>🏪 Lojinha da Vila Cogumelo</h2>
    <p style="margin-bottom: 10px;">Compre receitas e atraia novos clientes para a cafeteria!</p>
    
    <!-- É AQUI QUE O JAVASCRIPT DESENHA OS CARDS -->
    <div id="container-itens-loja" class="grid-loja"></div>
  </div>

  <!-- Elemento de Áudio para Música de Fundo -->
  <audio id="musica-fundo" src="musica.mp3" loop></audio>

  <!-- Script do Jogo -->
  <script src="script.js"></script>
</body>
</html>
