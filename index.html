<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogu City - Cafeteria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Painel de Informações (Moedas e Pontos) -->
    <header id="placar">
        <div class="moedas">Moedas: <span id="qtd-moedas">0</span> 🪙</div>
        <button id="btn-pause">Pausar</button>
    </header>

    <!-- Área Principal do Jogo (O Balcão) -->
    <main id="cenario">
        
        <!-- Onde o cliente vai aparecer -->
        <div id="area-cliente">
            <img id="sprite-cliente" src="" alt="Cliente Atual">
            <div id="balao-pedido">
                <p id="texto-pedido">Aguardando cliente...</p>
            </div>
        </div>

        <!-- Balcão de Pratos -->
        <div id="balcao">
            <button class="btn-item" onclick="entregarPedido('Chá')">☕ Chá</button>
            <button class="btn-item" onclick="entregarPedido('Bolo')">🍰 Bolo</button>
            <button class="btn-item" onclick="entregarPedido('Café')">☕ Café</button>
            <button class="btn-item" onclick="entregarPedido('Torta')">🥧 Torta</button>
        </div>

    </main>

    <!-- Lojinha de Melhorias -->
    <section id="lojinha">
        <h2>Lojinha de Melhorias</h2>
        <button class="btn-item" onclick="comprarUpgrade()">Melhorar Cafeteira (Upgrade)</button>
    </section>

    <!-- Conexão com a Lógica do Jogo (Sempre no final do body) -->
    <script src="script.js"></script>
</body>
</html>
